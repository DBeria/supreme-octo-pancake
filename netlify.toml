# File: netlify.toml

# This is the single source of truth for your build settings.
[build]
  # 1. First, navigate into the 'client' folder.
  # 2. Then, install all necessary dependencies.
  # 3. Finally, run the build command.
  command = "cd client && npm install && npm run build"
  
  # 2. After the build, the final public website is in the 'client/dist' folder.
  publish = "client/dist"

# Rule 1: The API Proxy for your live server.
[[redirects]]
  from = "/api/*"
  to = "https://pocus-world-backend.onrender.com/api/:splat"
  status = 200

# Rule 2: The Single-Page App (SPA) rule for React Router.
# This ensures that refreshing on any page works correctly.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200