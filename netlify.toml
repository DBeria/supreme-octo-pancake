# File: netlify.toml

# This is the final, correct build configuration.
[build]
  # This command chains all necessary steps together:
  # 1. cd client       -> Navigate into the client folder.
  # 2. npm install     -> Install all client-side dependencies (including Vite).
  # 3. npm run build   -> Now run the build, which will find the vite command.
  command = "cd client && npm install && npm run build"
  
  # The final, published site is in the client/dist directory.
  publish = "client/dist"

# --- Keep these redirect rules exactly as they are ---

# Rule 1: The API Proxy for your live server.
[[redirects]]
  from = "/api/*"
  to = "https://pocus-world-backend.onrender.com/api/:splat"
  status = 200

# Rule 2: The Single-Page App (SPA) rule for React Router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200