# File: netlify.toml

# This is the single source of truth for your build settings.
[build]
  # This command ensures all client dependencies are installed before building.
  command = "cd client && npm install && npm run build"
  
  # This tells Netlify where to find your finished website.
  publish = "client/dist"

# Rule 1: The API Proxy (for connecting to your backend)
[[redirects]]
  from = "/api/*"
  to = "https://pocus-world-backend.onrender.com/api/:splat"
  status = 200

# Rule 2: The SPA Catch-All (for React Router)
# This is VITAL. It ensures refreshing on any page works.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200